# RocketMQ Broker 配置文件
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 监听地址 - 使用宿主机IP，让外部可以访问
brokerIP1 = 172.20.161.243
listenPort = 10911

# 延迟消息相关
enablePropertyFilter = true

# ACL 配置 - 开发环境关闭鉴权
aclEnable = false

# 磁盘使用率阈值配置 - 放宽至 99% 避免开发环境磁盘满熔断
diskMaxUsedSpaceRatio=99
diskRatioForceClean=99
diskRatioInCleanSpace=99

# 指定存储路径，确保磁盘使用率检查在正确的文件系统上生效
storePathRootDir=/home/rocketmq/store