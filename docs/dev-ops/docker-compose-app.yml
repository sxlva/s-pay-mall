version: '3.8'
# docker-compose -f docker-compose-app.yml up -d
services:
  # 部署前端项目
  nginx:
    image: nginx:1.25.1
    container_name: nginx
    restart: always
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./nginx/html:/usr/share/nginx/html
    privileged: true
  # 部署后端项目
  s-pay-mall:
    image: system/s-pay-mall-ddd-fcr-app:1.0-SNAPSHOT
    container_name: s-pay-mall
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - TZ=PRC
      - SERVER_PORT=8091
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
      - ROCKETMQ_ACCESS_KEY=${ROCKETMQ_ACCESS_KEY}
      - ROCKETMQ_SECRET_KEY=${ROCKETMQ_SECRET_KEY}
      - ROCKETMQ_NAMESRV_ADDR=rocketmq-namesrv:9876
    volumes:
      - ./log:/data/log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - spay-network

networks:
  spay-network:
    external: true
