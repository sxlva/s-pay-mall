# 环境编排文件：本地一键启动 MySQL、Redis、RocketMQ 等依赖服务
# 命令执行 docker-compose -f docker-compose-environment.yml up -d
version: '3.9'

services:
  mysql-spay:
    image: mysql:8.0.32
    container_name: s-pay-mall-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "23306:3306"
    volumes:
      - ./mysql/sql:/docker-entrypoint-initdb.d
      - s-pay-mall-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - spay-network

  phpmyadmin-spay:
    image: phpmyadmin:5.2.1
    container_name: s-pay-mall-phpmyadmin
    ports:
      - "8898:80"
    environment:
      - PMA_HOST=mysql-spay
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql-spay:
        condition: service_healthy
    networks:
      - spay-network

  redis-spay:
    image: redis:6.2
    container_name: s-pay-mall-redis
    restart: always
    ports:
      - "26379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    networks:
      - spay-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-admin-spay:
    image: spryker/redis-commander:0.8.0
    container_name: s-pay-mall-redis-admin
    hostname: redis-commander
    restart: always
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOST=redis-spay
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - HTTP_USER=${ADMIN_USER}
      - HTTP_PASSWORD=${ADMIN_PASSWORD}
      - LANG=C.UTF-8
      - LANGUAGE=C.UTF-8
      - LC_ALL=C.UTF-8
    networks:
      - spay-network
    depends_on:
      redis-spay:
        condition: service_healthy

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: s-pay-mall-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    networks:
      - spay-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: s-pay-mall-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - ./rocketmq/store:/home/rocketmq/store
      - ./rocketmq/logs:/home/rocketmq/logs
      - ./rocketmq/conf:/home/rocketmq/conf
    networks:
      - spay-network

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: s-pay-mall-rocketmq-dashboard
    ports:
      - "8080:8080"
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
      - ROCKETMQ_CONFIG_IS_ACL_ENABLED=true
      - ROCKETMQ_CONFIG_ACCESS_KEY=${ROCKETMQ_ACCESS_KEY}
      - ROCKETMQ_CONFIG_SECRET_KEY=${ROCKETMQ_SECRET_KEY}
    depends_on:
      - rocketmq-namesrv
    networks:
      - spay-network

networks:
  spay-network:
    driver: bridge

volumes:
  s-pay-mall-mysql-data: